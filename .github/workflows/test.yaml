name: Run basic tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - ".github/workflows/build.yaml"
      - ".github/workflows/test.yaml"
      - "issue-bot/**"
      - "rust-toolchain.toml"
      - "Dockerfile"
    branches:
      - 'main'

permissions: {}

jobs:
  tests:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: local
          POSTGRES_PASSWORD: supersecurepassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Setup database
        env:
          PGPASSWORD: "supersecurepassword"
        run: |
         sudo apt-get update && sudo apt-get install libpq-dev -y
         psql -U local -a -f init_db.sql -h localhost
      - name: Run tests
        env:
          DATABASE_URL: "postgres://local:supersecurepassword@localhost:5432/lor_e"
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          cargo test
        working-directory: ./issue-bot
